<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../assets/styles.css"><link rel="stylesheet" href="../../assets/operational-analytics.css"><style>body{overflow:auto}.qa-frame{height:100dvh;overflow:auto;padding:1rem}.qa-note{font-size:.75rem;color:var(--muted);margin-bottom:.5rem}</style></head><body><main class="qa-frame"><p class="qa-note">Synthetic QA fixture · no production data or provider calls</p><div id="report"></div></main><script src="../../assets/operational-analytics.js"></script><script>
const query=new URLSearchParams(location.search);document.documentElement.dataset.theme=query.get('theme')==='light'?'light':'dark';
let scope={workspace:'fixture-one',name:'Synthetic operating location',user:'synthetic-owner',locale:query.get('lang')==='es'?'es':'en',days:30,through:'',enabled:true};
const recorded={schema_version:1,workspace_id:scope.workspace,timezone:'Europe/Madrid',generated_at:'2026-10-20T12:00:00Z',period:{from_date:'2026-09-20',through_date:'2026-10-19',previous_from_date:'2026-08-21',previous_through_date:'2026-09-19',days:30,partial:false},permissions:{pos:true,inventory:true,employees:true,export_tools:['pos','inventory','employees']},sales:{summary:[{currency:'EUR',period:'current',completed_sales:12,recorded_sales_cents:'123450',refunded_sales:1,voided_sales:0},{currency:'EUR',period:'previous',completed_sales:10,recorded_sales_cents:'110000',refunded_sales:0,voided_sales:0}],daily:[{day:'2026-10-19',currency:'EUR',completed_sales:12,recorded_sales_cents:'123450'}]},inventory:{snapshots:{},flows:[{currency:'EUR',period:'current',known_sale_consumption_cents:'20000.125000',known_waste_cents:'1000',unknown_outflow_cost_rows:2}]},staff:{sources:['pos','inventory'],active_members:3,actor_count:1,actors_truncated:false,totals:{current_actions:14,previous_actions:10},actors:[{actor_id:'synthetic-worker',display_name:'Synthetic team member',current_actions:14,previous_actions:10,pos_actions:12,inventory_actions:2}]},export:false,sitewide_discovery_included:false,profitability_available:false};
for(const key of ['previous_opening','opening','closing'])recorded.inventory.snapshots[key]={currencies:[{currency:'EUR',tracked_rows:5,known_value_cents:'80000.125000',complete_value_cents:null,unknown_cost_rows:1,unrecorded_rows:1}]};
window.qa={calls:[],downloads:[],deny:false};
const api={rpc:async(name,args)=>{window.qa.calls.push({name,args});if(window.qa.deny)return {data:null,error:{code:'42501'}};const value=JSON.parse(JSON.stringify(recorded));value.export=args.p_export;return {data:value,error:null};}};
const node=document.getElementById('report');const controller=AkiBusinessOperationalAnalytics.create({getScope:()=>scope,client:()=>api,changed:()=>{node.innerHTML=controller.render();},download:(name,content,type)=>qa.downloads.push({name,content,type})});
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='refresh-analytics')await controller.load();if(action==='operational-analytics-tab')controller.section(button.dataset.tab);if(action==='operational-analytics-export')await controller.exportReport();});
document.addEventListener('change',async event=>{if(event.target.dataset.change==='operational-analytics-days')scope.days=Number(event.target.value);else if(event.target.dataset.change==='operational-analytics-through')scope.through=event.target.value;else return;controller.reset();await controller.load();});
controller.load();
</script></body></html>
