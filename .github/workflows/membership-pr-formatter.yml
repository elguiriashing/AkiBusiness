name: Temporary membership PR formatter
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/product-scoped-memberships-20261018'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format changed source and tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | grep -E '\.(ts|tsx|css|md|json)$' || true)
          if [ ${#changed[@]} -gt 0 ]; then npx prettier --write "${changed[@]}"; fi
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: format product membership studio candidate'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
