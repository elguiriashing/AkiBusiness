name: Deploy verified AkiHQ brand
on:
  push:
    branches: [release/akihq-management-brand-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akisuite-hq-production
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AKISUITE_RELEASE_KIND: hq
      CLOUDFLARE_ACCOUNT_ID: 501bc9434d8ae555a6ac984a26dd2725
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify code and tests before production
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: tablet-local-disposable
          NEXT_PUBLIC_PRODUCT_NAME: AkiBusiness
          NEXT_PUBLIC_SITE_URL: https://akibusiness.com
          NEXT_PUBLIC_BUSINESS_URL: https://akibusiness.com
          NEXT_PUBLIC_CRM_URL: https://akihq.app
        run: npm run check
      - name: Load existing production bindings and check destination
        run: node scripts/brand-production-release.mjs prepare
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: brand-hq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: brand-hq-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build exact production source with existing public configuration
        run: npm run build:cloudflare
      - name: Validate deploy target, source stamp and bundle
        run: |
          node scripts/brand-production-release.mjs config
          npx wrangler deploy --config .wrangler/brand-production.json --dry-run --outdir .wrangler/brand-dry-run
      - name: Publish to existing Worker, preserving secrets and other variables
        run: npx wrangler deploy --config .wrangler/brand-production.json --keep-vars
      - name: Verify deployed source and brand icons over HTTPS
        run: node scripts/brand-production-release.mjs verify
