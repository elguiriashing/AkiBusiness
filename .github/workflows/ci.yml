name: Verify AkiBusiness operations
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'migration/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install integration gateway dependencies
        run: npm ci
        working-directory: cloudflare
      - name: Test integration gateway and production contracts
        run: npm run check
        working-directory: cloudflare
      - name: Static operations app smoke
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f assets/hospitality-pos.js
          test -f assets/akibusiness-brand.css
          node --test commerce-export.test.mjs inventory-ops.test.mjs multi-tenant.test.mjs tests/product-release.test.mjs
      - name: Build AkiBusiness production assets without deploying
        run: |
          NEXT_PUBLIC_AKISUITE_ROLE_SWAP=true node tools/build-product-release.mjs dist-product
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const j=JSON.parse(readFileSync("dist-product/release-source.json")); if(j.product!=="AkiBusiness"||!j.roleSwap||j.sourceTreeDirty)process.exit(1);'
          grep -q '<title>AkiBusiness</title>' dist-product/index.html
