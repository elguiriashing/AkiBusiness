name: AkiBusiness
on:
  pull_request:
  push:
    branches: [main, "migration/**"]
permissions:
  contents: read
concurrency:
  group: business-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: tablet-local-disposable
      NEXT_PUBLIC_PRODUCT_NAME: AkiBusiness
      NEXT_PUBLIC_SITE_URL: https://akibusiness.com
      NEXT_PUBLIC_BUSINESS_URL: https://akibusiness.com
      NEXT_PUBLIC_CRM_URL: https://akihq.app
      CIRCLE_NODE_TOTAL: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-business-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-business-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - run: npx playwright install --with-deps chromium
      - name: Anonymous browser acceptance
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3013 > /tmp/business-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for (let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:3013/api/health");if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
          npm run test:e2e
      - name: Disposable authenticated independent management acceptance
        run: node scripts/test-independent-management-browser.mjs
      - name: Rental desk browser acceptance
        run: RENTAL_BROWSER_MODE=operator node scripts/test-rental-app-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-verification
          path: |
            .wrangler/dry-run
            test-results/business
            test-results/independent-management
