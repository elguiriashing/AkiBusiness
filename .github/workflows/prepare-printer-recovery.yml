name: Prepare printer recovery migration
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/prepare-printer-recovery.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'fix/print-agent-uncertain-delivery-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate migration in an unlinked temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/printer-migration/supabase/migrations"
          cd "$RUNNER_TEMP/printer-migration"
          npm exec --yes --package=supabase@2.122.0 -- supabase --help
          npm exec --yes --package=supabase@2.122.0 -- supabase migration --help
          npm exec --yes --package=supabase@2.122.0 -- supabase migration new --help
          npm exec --yes --package=supabase@2.122.0 -- supabase migration new printer_recovery_ack
          find supabase/migrations -type f -name '*_printer_recovery_ack.sql' -print
          echo 'No remote project, credentials, database writes or deployments.'
