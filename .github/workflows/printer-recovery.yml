name: AkiBusiness printer recovery review
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/print-agent/**'
      - 'tests/print*.mjs'
      - 'tests/print*.py'
      - 'tests/security-fixture.mjs'
      - 'tests/pos-kds-fixture.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/printer-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: printer_recovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: printer_recovery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test local recovery and CLI safety
        run: node --test tests/print-agent.test.mjs tests/print-recovery.test.mjs
      - name: Apply synthetic schema and candidate migration
        shell: bash
        run: |
          set -euo pipefail
          node tests/print-recovery-postgres-schema.mjs > "$RUNNER_TEMP/printer-recovery-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/printer-recovery-fixture.sql"
      - name: Verify independent-connection recovery races
        run: python3 tests/print-recovery-postgres.py
